name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Corepack owns the pnpm/Yarn shims; --force replaces runner-provided shims in this ephemeral job.
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      - run: pnpm verify:release
      - run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
