<link rel="component" href="@threadlabs/looma/components/ui-icon-button/ui-icon-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-cycle-button/ui-cycle-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-badge/ui-badge.html">
<link rel="component" href="./search.html">
<link rel="component" href="@threadlabs/looma/components/ui-button/ui-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-icon/ui-icon.html">
<link rel="component" href="@threadlabs/looma/components/ui-site-header/ui-site-header.html">
<template component="markupress-header">
<defs>
<prop name="title" type="string" required>Site title</prop>
<prop name="home" type="string" required>Home URL</prop>
<prop name="logo" type="object({ light: string, dark: string })">Logo images for the light and dark themes</prop>
<prop name="badge" type="string" default="">Badge beside the title</prop>
<prop name="headerNotice" type="string" default="">Removable status chip before search</prop>
<prop name="nav" type="list(object({ label: string, href: string, current: string, icon: string }))" required>Top navigation: the sections, then the configured links, each with an icon URL or ""</prop>
<prop name="searchOptions" type="object({ limit: number, fuzzy: number, prefix: boolean })" default='{"limit":20,"fuzzy":0.2,"prefix":true}'>Local search matching options</prop>
<prop name="search" type="string" default="">The URL of the version's search index, or "" for no search</prop>
<prop name="appearance" type="string" default="automatic">The selected appearance: automatic, light or dark.</prop>
<prop name="appearanceReady" type="boolean" default="false">The browser has restored its saved appearance choice.</prop></defs>
<ui-site-header sticky label="Main" from:data-ready="$appearanceReady" style="--ui-site-header-height:var(--markupress-header-height,4.25rem);--ui-site-header-compact-height:var(--markupress-mobile-header-height,3.75rem);--ui-site-header-padding-inline:max(var(--ui-space-4),calc((100vw - var(--markupress-page-width,90rem)) / 2));--ui-site-header-z-index:2">
<template slot="menu"><slot name="menu"></slot></template>
<a class="brand-link" slot="brand" from:href="$home" from:aria-label="$title"><template $if="$logo"><img class="logo logo-light" from:src="$logo.light" alt=""><img class="logo logo-dark" from:src="$logo.dark" alt=""></template><span class="brand-title">{$title}</span><ui-badge $if="$badge" tone="accent">{$badge}</ui-badge></a>
<a slot="navigation" $each="item of $nav" from:href="$item.href" from:aria-current="$item.current"><template $match><img $when="$item.icon" class="nav-icon" from:src="$item.icon" from:alt="$item.label"><template $else>{$item.label}</template></template></a>
<span slot="actions" $if="$headerNotice" class="notice"><ui-button size="sm" variant="outline" tone="neutral" shape="pill" data-action="dismiss-header-notice" from:aria-label="concat('Remove ', $headerNotice)">{$headerNotice}<ui-icon name="x"></ui-icon></ui-button></span><markupress-search slot="actions" $if="$search" from:index="$search" from:options="$searchOptions"></markupress-search><ui-cycle-button slot="actions" label="Appearance" variant="outline" data-action="theme" from:index="{ automatic: 0, light: 1, dark: 2 }[$appearance]" items='[{"value":"automatic","label":"Automatic","icon":"monitor"},{"value":"light","label":"Light","icon":"sun"},{"value":"dark","label":"Dark","icon":"moon"}]'></ui-cycle-button>
</ui-site-header>
<style>
/* Documentation content and state; SiteHeader owns layout and responsive navigation. */
.brand-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { align-self: center; flex-shrink: 0; block-size: 2rem; inline-size: auto; }
.nav-icon { display: block; block-size: 1.25rem; inline-size: auto; }
:host:not([data-ready]) { --ui-motion-fast: 0ms; --ui-motion-base: 0ms; }
.notice { display: var(--markupress-header-notice-display, inline-flex); }
</style></template>
<template component="markupress-footer">
<defs><prop name="footer" type="object({ columns: list(object({ title: string, items: list(object({ label: string, href: string, current: string })) })), copyright: string })" required>Footer link columns and copyright</prop></defs>
<footer><div class="footer-columns" $if="$footer.columns.length"><div $each="column of $footer.columns"><strong>{$column.title}</strong><ul><li $each="link of $column.items"><a from:href="$link.href" from:aria-current="$link.current">{$link.label}</a></li></ul></div></div>
<p $if="$footer.copyright">{$footer.copyright}</p></footer>
<style>
:host { display: block; border-top: 1px solid var(--ui-border, #8885); padding: 2rem max(1.5rem, calc((100vw - var(--markupress-page-width, 90rem)) / 2)); color: var(--ui-text-muted, inherit); font-size: .9rem; }
.footer-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1.5rem; } ul { margin: .5rem 0 0; padding: 0; list-style: none; } li { margin: .25rem 0; } strong { color: var(--ui-text); }
p { margin: 1.5rem 0 0; }
a { color: var(--ui-link-color, var(--ui-accent)); text-underline-offset: .2em; } a[aria-current="page"] { font-weight: 700; } :focus-visible { outline: 2px solid var(--ui-focus-ring, var(--ui-accent)); outline-offset: 3px; }
</style></template>
