<link rel="component" href="@threadlabs/looma/components/ui-icon-button/ui-icon-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-cycle-button/ui-cycle-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-badge/ui-badge.html">
<link rel="component" href="./search.html">
<link rel="component" href="@threadlabs/looma/components/ui-button/ui-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-icon/ui-icon.html">
<template component="markupress-header">
<defs>
<prop name="title" type="string" required>Site title</prop>
<prop name="home" type="string" required>Home URL</prop>
<prop name="logo" type="object({ light: string, dark: string })">Logo images for the light and dark themes</prop>
<prop name="badge" type="string" default="">Badge beside the title</prop>
<prop name="headerNotice" type="string" default="">Removable status chip before search</prop>
<prop name="nav" type="list(object({ label: string, href: string, current: string, icon: string }))" required>Top navigation: the sections, then the configured links, each with an icon URL or ""</prop>
<prop name="search" type="string" default="">The URL of the version's search index, or "" for no search</prop>
<prop name="appearance" type="string" default="automatic">The selected appearance: automatic, light or dark.</prop>
<prop name="appearanceReady" type="boolean" default="false">The browser has restored its saved appearance choice.</prop></defs>
<header><slot name="menu"></slot>
<a class="brand" from:href="$home"><template $if="$logo"><img class="logo logo-light" from:src="$logo.light" alt=""><img class="logo logo-dark" from:src="$logo.dark" alt=""></template><span class="brand-title">{$title}</span></a>
<ui-badge $if="$badge" tone="accent">{$badge}</ui-badge>
<nav class="top" $if="$nav.length" aria-label="Main"><ul><li $each="item of $nav">
<a from:href="$item.href" from:aria-current="$item.current"><template $match><img $when="$item.icon" from:src="$item.icon" from:alt="$item.label"><template $else>{$item.label}</template></template></a>
</li></ul></nav>
<div class="actions" from:data-ready="$appearanceReady"><span $if="$headerNotice" class="notice"><ui-button size="sm" variant="outline" tone="neutral" shape="pill" data-action="dismiss-header-notice" from:aria-label="concat('Remove ', $headerNotice)">{$headerNotice}<ui-icon name="x"></ui-icon></ui-button></span><markupress-search $if="$search" from:index="$search"></markupress-search><ui-cycle-button label="Appearance" variant="outline" data-action="theme" from:index="{ automatic: 0, light: 1, dark: 2 }[$appearance]" items='[{"value":"automatic","label":"Automatic","icon":"monitor"},{"value":"light","label":"Light","icon":"sun"},{"value":"dark","label":"Dark","icon":"moon"}]'></ui-cycle-button></div></header>
<style>
:host { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ui-space-2) var(--ui-space-6); min-block-size: var(--markupress-header-height, 4.25rem); border-bottom: 1px solid var(--ui-border, #8885); padding: var(--ui-space-2) max(var(--ui-space-4), calc((100vw - var(--markupress-page-width, 90rem)) / 2)); background: var(--ui-surface); }
.brand { min-inline-size: 0; display: flex; align-items: baseline; gap: var(--ui-space-3); color: inherit; font-size: 1.15rem; font-weight: 700; text-decoration: none; } .brand-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .logo { align-self: center; flex-shrink: 0; block-size: 2rem; inline-size: auto; }
.actions:not([data-ready]) { --ui-motion-fast: 0ms; --ui-motion-base: 0ms; }
.notice { display: var(--markupress-header-notice-display, inline-flex); }
.actions { align-self: center; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(max-content, var(--ui-control-min-block-size)); flex-shrink: 0; align-items: center; justify-items: center; gap: var(--ui-space-2); margin-inline-start: auto; }
ul { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ui-space-2) var(--ui-space-5); margin: 0; padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; } a:hover, a[aria-current="page"], a[aria-current="true"] { color: var(--ui-accent); } a[aria-current="page"] { font-weight: 700; }
.top { font-size: var(--ui-font-size-sm); font-weight: var(--ui-font-semibold); }
.top img { display: block; block-size: 1.25rem; inline-size: auto; }
:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 3px; }
@media (max-width: 996px) { :host { flex-wrap: nowrap; min-block-size: var(--markupress-mobile-header-height, 3.75rem); } .brand { flex: 1; } .top { display: none; } }
@media (max-width: 640px) { :host { padding-inline: 1rem; } .actions:has(.notice) { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(max-content, var(--ui-control-min-block-size))); } .notice { grid-column: 1 / -1; justify-self: end; } }
</style></template>
<template component="markupress-footer">
<defs><prop name="footer" type="object({ columns: list(object({ title: string, items: list(object({ label: string, href: string, current: string })) })), copyright: string })" required>Footer link columns and copyright</prop></defs>
<footer><div class="footer-columns" $if="$footer.columns.length"><div $each="column of $footer.columns"><strong>{$column.title}</strong><ul><li $each="link of $column.items"><a from:href="$link.href" from:aria-current="$link.current">{$link.label}</a></li></ul></div></div>
<p $if="$footer.copyright">{$footer.copyright}</p></footer>
<style>
:host { display: block; border-top: 1px solid var(--ui-border, #8885); padding: 2rem max(1.5rem, calc((100vw - var(--markupress-page-width, 90rem)) / 2)); color: var(--ui-text-muted, inherit); font-size: .9rem; }
.footer-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1.5rem; } ul { margin: .5rem 0 0; padding: 0; list-style: none; } li { margin: .25rem 0; } strong { color: var(--ui-text); }
p { margin: 1.5rem 0 0; }
a { color: var(--ui-accent); text-underline-offset: .2em; } a[aria-current="page"] { font-weight: 700; } :focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 3px; }
</style></template>
