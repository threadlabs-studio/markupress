<link rel="component" href="@threadlabs/looma/components/ui-disclosure/ui-disclosure.html">
<link rel="component" href="@threadlabs/looma/components/ui-nav-item/ui-nav-item.html">
<link rel="component" href="@threadlabs/looma/components/ui-icon/ui-icon.html">
<template component="markupress-nav-items">
<defs>
<prop name="items" type="list(object({ label: string, current: string, depth: number, href?: string, group?: string, open?: boolean, children?: list(object({ label: string, ... })), ... }))" required>HTMLKit navigation items with nested sections.</prop>
</defs>
<ul><li $each="item of $items">
<template $match>
<ui-disclosure $when="$item.children" variant="navigation" density="compact" from:summary="$item.label" from:open="$item.open">
<ui-icon slot="indicator" name="chevron-down"></ui-icon>
<ui-nav-item $if="$item.href" as="a" density="compact" from:href="$item.href" from:current="$item.current">{concat($item.label, ' overview')}</ui-nav-item>
<markupress-nav-items from:items="$item.children"></markupress-nav-items>
</ui-disclosure>
<ui-nav-item $else as="a" density="compact" from:href="$item.href" from:current="$item.current">{$item.label}</ui-nav-item>
</template>
</li></ul>
<style>
:host { display: block; min-inline-size: 0; list-style: none; margin: 0; padding: 0; }
li { margin: var(--ui-space-0-5) 0; padding: 0; }
</style>
</template>
<template component="markupress-navigation">
<defs>
<prop name="items" type="list(object({ label: string, current: string, depth: number, href?: string, open?: boolean, children?: list(object({ label: string, ... })), ... }))" required>HTMLKit's section navigation, rendered with Looma controls.</prop>
<prop name="label" type="string" default="Documentation">Accessible name for this navigation region.</prop>
</defs>
<div>
<nav class="enhanced" from:aria-label="$label"><markupress-nav-items from:items="$items"></markupress-nav-items></nav>
<div class="native"><hk-nav from:items="$items" from:label="$label"></hk-nav></div>
</div>
<style>
.native { display: none; }
@media (scripting: none) { .enhanced { display: none; } .native { display: block; } }
</style>
</template>
