<link rel="component" href="./chrome.html">
<!-- The home layout (front matter layout: home): the shell's top navigation and footer around a full-width page, which
     Markupress reads as a hero and feature cards. A site's app/layouts/home.html replaces it. -->
<template component="markupress-home" controller="../dist/controllers/shell.js">
<defs>
<title>{$title}</title>
<!-- A null favicon leaves the link out. -->
<link rel="icon" from:href="$favicon">
<prop name="title" type="string" required>Site title</prop>
<prop name="home" type="string" required>Home URL</prop>
<prop name="logo" type="object({ light: string, dark: string })">Logo images for the light and dark themes</prop>
<prop name="favicon" type="string">Site icon URL</prop>
<prop name="badge" type="string" default="">Badge beside the title</prop>
<prop name="headerNotice" type="string" default="">Removable status chip before search</prop>
<prop name="search" type="string" default="">The URL of the version's search index</prop>
<prop name="nav" type="list(object({ label: string, href: string, current: string, icon: string }))" required>Top navigation: the sections, then the configured links</prop>
<prop name="footer" type="object({ columns: list(object({ title: string, items: list(object({ label: string, href: string, current: string })) })), copyright: string })" required>Footer link columns and copyright</prop>
<state name="appearance" type="string" value="automatic"></state>
<state name="appearanceReady" type="boolean" value="false"></state></defs>
<div class="site"><a class="skip" href="#documentation-content">Skip to content</a>
<markupress-header from:title="$title" from:home="$home" from:logo="$logo" from:badge="$badge" from:header-notice="$headerNotice" from:nav="$nav" from:search="$search" from:appearance="$appearance" from:appearance-ready="$appearanceReady"></markupress-header>
<main id="documentation-content" tabindex="-1"><slot name="page"></slot></main>
<markupress-footer $if="$footer.columns.length or $footer.copyright" from:footer="$footer"></markupress-footer></div>
<style>
:host { display: block; background: var(--ui-surface); color: var(--ui-text); font: var(--ui-font-size-md)/var(--ui-line-height-relaxed) var(--markupress-font, var(--ui-font-sans)); min-height: 100vh; }
.site { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1; inline-size: 100%; max-inline-size: var(--markupress-home-width, 75rem); margin-inline: auto; padding: 2rem 1.5rem 4rem; }
.skip { position: absolute; top: .5rem; left: 1rem; transform: translateY(-200%); padding: .5rem 1rem; background: var(--ui-surface); color: var(--ui-accent); z-index: 3; } .skip:focus { transform: none; }
:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 3px; }
@media (max-width: 768px) { main { padding: 1rem 1rem 3rem; } }
</style></template>
