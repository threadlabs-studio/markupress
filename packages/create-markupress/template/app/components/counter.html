<template component="demo-counter" controller="./counter.js">
  <defs><state name="count" type="number" value="0"></state></defs>
  <div><button>Count</button><output>{$count}</output></div>
  <style>:host { display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--ui-border); border-radius: var(--ui-radius-md); }</style>
</template>
